[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kagura-engineer"
dynamic = ["version"]
description = "Autonomous memory-grounded coding harness over Claude Code or Codex"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kagura AI", email = "dev@kagura-ai.com" }]
keywords = [
    "claude-code",
    "codex",
    "ai-agent",
    "coding-agent",
    "autonomous-agent",
    "kagura",
    "memory",
    "llm",
    "harness",
    "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "kagura-memory>=0.30,<0.31",
    # Owns the headless CLI-agent launcher seam and the provider-neutral
    # `select()` → `BrainHandle` selector (#63): subscription auth + the
    # stale-ANTHROPIC_API_KEY strip (#34), shared across harnesses. `select`
    # (the generic claude/codex dispatch we retired our own copy of) needs >=0.3;
    # we build on 0.4's selector + BRAIN_API_KEY_ENV + fail-closed BrainHandle.
    # >=0.4.1 carries the Windows `.cmd`-shim launch fix (core._run / _launch_argv,
    # brain #17) so a fresh install is launchable on native Windows (issue #78-B).
    "kagura-brain>=0.4.1,<0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=6.0"]
# The `review` command shells out to the kagura-code-reviewer console script.
# It is the one runtime dependency that lives on PyPI (claude/gh/ollama do not),
# so it is offered as an opt-in extra. Without it, `review` degrades to a clean
# FAIL gate. `kagura-engineer setup` can also bootstrap it.
review = ["kagura-code-reviewer"]

[project.urls]
Homepage = "https://github.com/kagura-ai/kagura-engineer"
Repository = "https://github.com/kagura-ai/kagura-engineer"
Issues = "https://github.com/kagura-ai/kagura-engineer/issues"
Changelog = "https://github.com/kagura-ai/kagura-engineer/blob/main/CHANGELOG.md"

[project.scripts]
kagura-engineer = "kagura_engineer.cli:app"

[tool.hatch.version]
path = "src/kagura_engineer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kagura_engineer"]

[tool.hatch.build.targets.sdist]
# Keep internal design/planning docs and the Claude Code plugin wrapper out of
# the published artifact. The plugin (.claude-plugin/ + skills/) is distributed
# via git (kagura-plugins marketplace), not PyPI; the wheel already excludes it
# by packaging only src/kagura_engineer.
exclude = ["/docs", "/skills", "/.claude-plugin"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/kagura_engineer"]

[tool.coverage.report]
# A floor well below the current 96% — guards against silent erosion without
# being brittle. Raise as coverage climbs.
fail_under = 90
